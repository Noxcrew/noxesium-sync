[versions]
# Plugins
shadow = "9.4.2"
spotless = "8.1.0"
loom = "1.17-SNAPSHOT"
paperweight = "2.0.0-beta.21"
run-paper = "3.0.2"

# Tooling
kotlin-coroutines = "1.11.0"
kotlin-serialization = "1.11.0"
guava = "33.3.1-jre"
slf4j = "2.0.16"

# Various
annotations = "24.1.0"
gson = "2.10"
prtree = "1.5.0"
caffeine = "3.1.8"
adventure = "4.26.1"
adventure-fabric = "7.0.0-SNAPSHOT"
apache-commons = "3.17.0"
joml = "1.10.8"
juniversalchardet = "2.5.0"
jgit = "7.7.0.202606012155-r"

# Fabric - https://modmuss50.me/fabric.html
minecraft = "26.2"
fabric-loader = "0.19.3"
fabric-api = "0.152.1+26.2"

# Mods
noxesium = "3.2.3"
modmenu = "20.0.0-beta.2"
devlogin = "0.1.0.5"

# Paper
viaversion = "5.9.1"

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }
paperweight = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }

[libraries]
# Tooling
kotlin-coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlin-coroutines" }
kotlin-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlin-serialization" }
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }
slf4j = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }

annotations = { group = "org.jetbrains", name = "annotations", version.ref = "annotations" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
caffeine = { group = "com.github.ben-manes.caffeine", name = "caffeine", version.ref = "caffeine" }
prtree = { group = "org.khelekore", name = "prtree", version.ref = "prtree" }
adventure-api = { group = "net.kyori", name = "adventure-api", version.ref = "adventure" }
adventure-fabric = { group = "net.kyori", name = "adventure-platform-fabric", version.ref = "adventure-fabric" }
apache-commons = { group = "org.apache.commons", name = "commons-lang3", version.ref = "apache-commons" }
joml = { group = "org.joml", name = "joml", version.ref = "joml" }
juniversalchardet = { group = "com.github.albfernandez", name = "juniversalchardet", version.ref = "juniversalchardet" }
jgit = { group = "org.eclipse.jgit", name = "org.eclipse.jgit", version.ref = "jgit" }

minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }
fabric-loader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabric-loader" }
fabric-api = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabric-api" }

noxesium-api = { module = "com.noxcrew.noxesium:api", version.ref = "noxesium" }
noxesium-nms = { module = "com.noxcrew.noxesium:nms", version.ref = "noxesium" }
noxesium-fabric = { module = "com.noxcrew.noxesium:fabric", version.ref = "noxesium" }
noxesium-paper = { module = "com.noxcrew.noxesium:paper-platform", version.ref = "noxesium" }

modmenu = { group = "com.terraformersmc", name = "modmenu", version.ref = "modmenu" }
devlogin = { group = "net.covers1624", name = "DevLogin", version.ref = "devlogin" }

viaversion = { group = "com.viaversion", name = "viaversion-api", version.ref = "viaversion" }